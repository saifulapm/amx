[package]
name = "amx-server"
description = "amx session server: actors, PTY, connections, damage and history"
license = "MIT OR Apache-2.0"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
amx-core = { workspace = true }
amx-proto = { workspace = true }
amx-vt = { workspace = true }
bytes = { workspace = true }
regex = { workspace = true }
# `net` carries `sendmsg`/`recvmsg` and `SendAncillaryBuffer`/`ScmRights`: the
# descriptor transfer of D-M3-6, enabled here by W03 so W05 adds code and not a
# dependency.
rustix = { workspace = true, features = [
    "event",
    "fs",
    "net",
    "pipe",
    "process",
    "pty",
    "std",
    "stdio",
    "termios",
] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true, features = ["parse", "serde"] }
tokio = { workspace = true, features = [
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tokio-util = { workspace = true }
tracing = { workspace = true }
# The per-spawn hook token (D-M2-4) is 122 random bits from the same generator
# every id in the tree already uses; uuid is a workspace dependency already.
uuid = { workspace = true, features = ["v4"] }

# libproc (cwd, children) is not covered by rustix; libc carries the
# declarations and is already in the tree transitively.
[target.'cfg(target_os = "macos")'.dependencies]
libc = { workspace = true }

[dev-dependencies]
# The fusion machine is pure data-in/data-out, so its acceptance is arbitrary
# interleavings rather than scripted ones (D-M2-6). Already in the tree:
# `amx-core` property-tests its own invariants with it.
proptest = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
