[package]
name = "amx"
description = "A minimal, keyboard-only agent terminal multiplexer"
license = "MIT OR Apache-2.0"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
amx-client = { workspace = true }
amx-core = { workspace = true }
amx-proto = { workspace = true, features = ["cli"] }
amx-server = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true, features = [
    "error-context",
    "help",
    "std",
    "suggestions",
    "usage",
] }
tokio = { workspace = true, features = [
    "io-std",
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "time",
] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
serde_json = { workspace = true }

# Test-only: the CLI acceptance tests drive the real binary against a real
# terminal, and `tcgetattr`/`tcsetattr` refuse anything that is not a tty.
[dev-dependencies]
rustix = { workspace = true, features = ["pty", "std", "termios"] }
