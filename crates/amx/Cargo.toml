[package]
name = "amx"
description = "A minimal, keyboard-only agent terminal multiplexer"
license = "MIT OR Apache-2.0"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
amx-client = { workspace = true }
amx-core = { workspace = true }
amx-proto = { workspace = true, features = ["cli"] }
amx-server = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true, features = [
    "error-context",
    "help",
    "std",
    "suggestions",
    "usage",
] }
tokio = { workspace = true, features = [
    "io-std",
    "io-util",
    "macros",
    "net",
    # `integration status` execs the binary an installed hook names, under a
    # timeout: a check that can hang is a check nobody runs.
    "process",
    "rt-multi-thread",
    "signal",
    "time",
] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
# The integration installer's one hand-written `Deserialize` keeps an agent's
# configuration in the order it was written in, which `serde_json`'s own `Value`
# cannot do without reordering the tree; `derive` is here for the layout file's
# schema, which is an ordinary set of structs and has no such constraint.
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# `amx update apply` verifies the asset it downloaded before it renames one
# byte of it over the running binary. The alternatives are hand-rolled SHA-256
# and parsing `sha256sum`/`shasum` output across platforms; both are worse on
# correctness grounds, and herdr made the same call (R-M3-8).
sha2 = { workspace = true }
# Reading layout files (D-M3-11). `display` is deliberately absent: export
# renders its own TOML, so that the key order, the comments and the omission of
# every default are the file's design rather than a serializer's.
toml = { workspace = true, features = ["parse", "serde"] }

# Test-only: the CLI acceptance tests drive the real binary against a real
# terminal, and `tcgetattr`/`tcsetattr` refuse anything that is not a tty.
[dev-dependencies]
rustix = { workspace = true, features = ["fs", "pty", "std", "termios"] }
