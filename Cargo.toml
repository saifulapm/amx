[package]
name = "amx"
version = "0.1.0"
edition = "2024"
description = "Run coding agents as tmux panes"
license = "MIT OR Apache-2.0"
repository = "https://github.com/saifulapm/amx"
homepage = "https://saifulapm.github.io/amx"
readme = "README.md"
keywords = ["tmux", "agents", "claude", "cli", "tui"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
clap_complete = "4.6.9"
crossterm = "0.29.0"
nix = { version = "0.31.3", features = ["process", "signal", "term", "fs", "user"] }
pulldown-cmark = { version = "0.13", default-features = false }
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11"
toml = "1.1.4"
toml_edit = "0.25"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"

[profile.release]
lto = "thin"
strip = true
