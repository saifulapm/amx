name: Release

on:
  push:
    tags: ['v*']

# Only the job that publishes can write; every other job reads.
permissions:
  contents: read

jobs:
  # A tag that is not Cargo.toml's version stops here, before anything is
  # built.
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check the tag is the package version
        env:
          TAG: ${{ github.ref_name }}
        run: sh .github/scripts/tag-version.sh "$TAG"

  # The whole suite on the tagged commit, the same run CI does on main.
  test:
    needs: version
    uses: ./.github/workflows/ci.yml

  build:
    needs: [version, test]
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          name="amx-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/amx" LICENSE-MIT LICENSE-APACHE README.md "$name/"
          tar -czf "$name.tar.gz" "$name"
          if command -v sha256sum >/dev/null; then
            sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          else
            shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: amx-${{ matrix.target }}.tar.gz*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          # The annotated tag's message is the release notes. checkout can
          # leave a lightweight copy of the tag, so fetch the real one.
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          git tag -l --format='%(contents)' "$TAG" > notes.md
          flags=()
          [[ "$TAG" == *-* ]] && flags+=(--prerelease)
          [[ -s notes.md ]] && flags+=(--notes-file notes.md) || flags+=(--generate-notes)
          gh release create "$TAG" dist/* --title "amx $TAG" --verify-tag "${flags[@]}"
