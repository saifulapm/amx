name: Pages

# The site describes what installs, so it is built from the newest release
# tag, never from main: once a release is published, or by hand. A docs fix
# on main reaches the site with the next tag, or a manual run once it is on
# that tag. The release's run starts this one on main, so the github-pages
# environment's rule for main still holds.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and a deploy already running is left to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # The newest v* tag by version; a prerelease, with a - in its tag, is skipped.
      - name: Check out the newest tag
        shell: bash
        run: |
          tag=$(git tag --list 'v*' --sort=-v:refname | grep -v -- - | sed -n 1p)
          test -n "$tag"
          git checkout --detach "$tag"
          echo "Built from $tag" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        working-directory: site
        run: npm ci

      # The demo video lives on a release, not in git, so clones stay small.
      - name: Fetch the demo video
        run: curl -fsSL -o site/assets/amx-demo.mp4 https://github.com/saifulapm/amx/releases/download/v0.1.0/amx-demo.mp4

      - name: Build
        working-directory: site
        run: node build.mjs

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
