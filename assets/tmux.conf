# amx — the lines worth having in a tmux.conf, and what each one changes.
#
# amx brings no tmux config of its own. An agent is a pane on the server you
# already run, and that server reads the file you already wrote, so nothing
# here is needed to start one: a tmux out of the box spawns agents, attaches
# to them and answers their questions. What is below is the difference
# between that and a fleet that is comfortable to sit in front of.
#
# Copy the lines you want into your own config rather than sourcing this file.
# A tmux.conf is personal — your prefix, your colours, your habits — and the
# keys here are written under whatever prefix you already press.

# ── The keys the view reads ──────────────────────────────────────────────
#
# `shift+enter` puts a newline in the line you are writing without sending
# it. Whether that key can arrive at all is the terminal's business and
# tmux's: without extended keys tmux hands the pane a plain enter, and the
# line goes. amx keeps `alt+enter` and then `ctrl+j` as the same newline for
# the terminals where the first spelling never arrives — these two lines are
# what makes the first one work rather than the third.
#
# Both are off out of the box: `extended-keys` is `off` and
# `extended-keys-format` is `xterm`. csi-u is the spelling amx is driven with
# day to day.
set -g extended-keys on
set -g extended-keys-format csi-u

# ── The counts in the corner ─────────────────────────────────────────────
#
# `amx statusline` prints ✽<moving> ⚠<waiting>, and nothing at all when
# neither is worth saying, so a quiet machine costs no room in the bar. It is
# plain bytes with no colour of its own — it lands inside a line that is not
# amx's — so wrap it in a #[fg=...] of your own to match the rest.
#
# status-interval is how old those counts may be. It defaults to 15 seconds,
# and the command is a few milliseconds of reading the state directory, so 5
# is honest without being greedy.
#
# A bar that hides itself has nowhere to put this. If your config turns
# `status` off while a session has one window — a common line, and hooks
# survive a reload, so `tmux set-hook -gu window-linked` is what unsets it —
# then the counts are on screen almost never, and that is the line to think
# again about rather than this one.
set -g status-right '#(amx statusline)'
set -g status-interval 5

# ── A key for the agent that needs you ───────────────────────────────────
#
# `attach` with no id asks the wall which agent was meant, which is what a key
# can carry and a typed id cannot. `--waiting` goes to the first agent stopped
# on a question, else the first whose work waits on a reviewer, else the turn
# that ended most recently; `--next` steps along the wall from wherever you
# are; `--last` goes back to the agent this terminal was in before.
#
# Behind the prefix, not in the root table. A `bind -n M-j` is one press
# fewer, and one key fewer for every pane on the server — and the panes here
# are agents: the view alone reads alt+a, alt+m, alt+e, alt+w, alt+d,
# alt+enter, alt+backspace and alt+1..9, and the vendors read more. The
# prefix costs a keystroke and takes nothing. Where you have keys to spare,
# `bind -n M-j run-shell "amx attach --next"` is the same command.
bind a run-shell "amx attach --waiting"
bind A run-shell "amx attach --next"
bind C-a run-shell "amx attach --last"

# The wall itself, in a window of its own. A second press lands on the window
# already open rather than making another.
bind v run-shell "tmux select-window -t amx 2>/dev/null || tmux new-window -n amx amx"

# ── Where you land when an agent's session goes ──────────────────────────
#
# `amx stop` takes the agent's pane and the session goes with it, and so does
# parking an idle agent nobody is watching. On tmux's default a client sitting
# in that session is detached along with it, which puts you back at a shell
# outside tmux; with this, tmux moves you to the session you were in last.
set -g detach-on-destroy off

# ── What you do not have to set ──────────────────────────────────────────
#
# `mouse`: the view asks your terminal for the mouse itself and hands it back
# whenever it lends the screen out, so a click on a row is `enter` on it
# whether or not tmux is reading the mouse for its own panes.
#
# `ctrl+z`: amx binds it on the server as it hands a terminal over, and reads
# it only in the sessions it named — `amx-<id>` — so in every other session on
# that server ctrl+z is still whatever it was.
#
# `escape-time`: a current tmux holds esc for 10ms, which esc-to-interrupt
# does not feel. Older ones held it for half a second, and `tmux show -g
# escape-time` says which yours is.
