# Suggested tmux.conf lines for amx, and what each one changes.
#
# amx needs none of these: agents run on your existing tmux server with your
# existing config. These lines make day-to-day use more comfortable. Copy the
# ones you want into your own tmux.conf rather than sourcing this file. The
# key bindings below go under whatever prefix you already use.

# ── Keys the view reads ──────────────────────────────────────────────────
#
# In the view, shift+enter adds a newline without sending the line. tmux only
# passes shift+enter through with extended keys on; without them it arrives as
# a plain enter. alt+enter and ctrl+j do the same where shift+enter cannot
# arrive. tmux defaults to `extended-keys off` and `extended-keys-format xterm`.
set -g extended-keys on
set -g extended-keys-format csi-u

# ── Agent counts in the status bar ───────────────────────────────────────
#
# `amx statusline` prints ✽<moving> ⚠<waiting>, or nothing when both are zero.
# It prints no colours of its own; wrap it in #[fg=...] to match your bar.
#
# status-interval sets how stale the counts may be (tmux defaults to 15
# seconds). The command takes a few milliseconds, so 5 is cheap.
#
# If your config hides the status bar when a session has one window, the
# counts are rarely visible. Hooks survive a config reload, so
# `tmux set-hook -gu window-linked` is how to remove such a hook.
set -g status-right '#(amx statusline)'
set -g status-interval 5

# ── Jump to the agent that needs you ─────────────────────────────────────
#
# `amx attach` with no id picks the agent: `--waiting` goes to the first agent
# stopped on a question, else the first whose work waits on a review, else the
# one whose turn ended most recently; `--next` steps along the wall; `--last`
# goes back to the agent this terminal was in before.
#
# These are bound under the prefix. A root binding (`bind -n M-j`) would take
# the key from every pane on the server, and the panes are agents: the view
# reads alt+a, alt+m, alt+e, alt+w, alt+d, alt+enter, alt+backspace and
# alt+1..9, and the vendors read more. If you have keys to spare,
# `bind -n M-j run-shell "amx attach --next"` works the same way.
bind a run-shell "amx attach --waiting"
bind A run-shell "amx attach --next"
bind C-a run-shell "amx attach --last"

# Open the view in a window named amx, or switch to it if it is already open.
bind v run-shell "tmux select-window -t amx 2>/dev/null || tmux new-window -n amx amx"

# ── When an agent's session closes ───────────────────────────────────────
#
# `amx stop` closes the agent's session, and so does parking an idle agent. By
# default tmux detaches a client that was in that session, which drops you to
# a shell outside tmux. With this, tmux switches you to your previous session.
set -g detach-on-destroy off

# ── What you do not need to set ──────────────────────────────────────────
#
# `mouse`: the view enables the mouse itself and releases it whenever it hands
# the terminal to something else, so clicking a row works either way.
#
# `ctrl+z`: amx binds it on the server when it hands a terminal over, and only
# in its own `amx-<id>` sessions. In every other session ctrl+z is unchanged.
#
# `escape-time`: current tmux waits 10ms after esc, which does not delay
# interrupting an agent. Older versions waited 500ms; check yours with
# `tmux show -g escape-time`.
