# Screen rules for opencode, read where amx's TUI plugin cannot speak for the
# person: a pane with no provider, and the permission and question cards a turn
# stops on. A screen no rule claims reads `unknown`. Matching is documented in
# assets/screen-rules.toml.
#
# Every anchor was read off a live opencode 2.0.16 run with `--standalone` on
# its default alternate screen, captured with `capture-pane -p -J` at 220, 100,
# 54 and 24 columns and 40 rows. The captures are in tests/opencode/screens,
# src/rules.rs tests every rule against them, and docs/opencode-screens.md says
# how each screen was raised. The source (tag v2.0.16) was used only to find the
# screens.
#
# No [furniture] table: the composer is a left bar (`┃`) closed by a half-block
# row (`╹▀▀▀`), which src/furniture.rs does not walk, so an opencode pane keeps
# every row.

# Connect dialog, opened over the home route when a message is sent with no
# provider. Its title is above the rows a rule sees at 100 columns, so the
# anchors are the `Popular` heading and the row under it, cut to `OpenCode
# Conso` at 24. A setup gate: connecting a provider is the person's job.
[[rule]]
name = "connect"
state = "waiting"
kind = "question"
setup = true
all = ["popular"]
any = ["opencode conso"]
within = 1

# No provider, raised with the models catalog emptied (`OPENCODE_MODELS_PATH`
# naming `{}`, `OPENCODE_DISABLE_MODELS_FETCH=1`). The model label under the
# composer reads `No provider selected`, cut to `No provider se…` at 24 columns.
# A `--prompt` task waits in the composer. A setup gate.
[[rule]]
name = "no_provider"
state = "waiting"
kind = "question"
setup = true
all = ["no provider se"]

# Permission card, drawn in place of the composer. Raised with a shell rule of
# `"effect":"ask"` in OPENCODE_CONFIG_CONTENT, since the default build agent runs
# shell commands without asking. At 24 columns the title wraps after
# `△ Permission`; both anchors are whole at every width. Only the shell card was
# measured.
[[rule]]
name = "permission"
state = "waiting"
kind = "permission"
all = ["allow once"]
any = ["△ permission"]

# Question form, drawn in place of the composer. The last choice, `Type your own
# answer`, is opencode's own. At 24 columns the hints are split into narrow
# columns, so `esc dismiss` breaks and `↑↓` survives. The permission card says
# `⇆ select` instead.
[[rule]]
name = "question"
state = "waiting"
kind = "question"
all = ["type your own"]
any = ["↑↓"]

# A running turn: the footer shows a spinner and `esc interrupt`, or `esc again
# to interrupt` for a few seconds after one Esc. At 24 columns opencode cuts
# either to `esc...upt` (three full stops). Retries after a provider error and
# steered messages keep this footer. claude's `esc to interrupt` matches none.
[[rule]]
name = "working"
state = "working"
any = ["esc interrupt", "esc again to interrupt", "esc...upt"]

# The idle composer: home route, after a turn, after Esc and after a provider
# error. The `╹▀▀▀` row closing the bar is the one anchor present at every
# width. A running turn, the no-provider home and the connect dialog draw it
# too, so those rules come first. The two cards replace the composer.
[[rule]]
name = "prompt"
state = "idle"
quiescent = true
all = ["╹▀▀▀"]
