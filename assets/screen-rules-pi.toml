# What amx recognises on a pi pane.
#
# When the record goes quiet, a reader matches the bottom of the pane against
# these rules, as assets/screen-rules.toml does for claude. Rules are ordered
# and the first that holds decides. `all` must all appear and `any` at least
# one, in the capture with control characters replaced and case folded. A
# screen no rule claims reads `unknown`. src/vendor/pi.rs points at this file.
#
# Every anchor was read off a live pi. pi's JS on disk was read only to learn
# which screens exist and how to reach them. docs/pi-screens.md holds the
# captures.
#
# - pi 0.84.4, captured as src/tmux.rs captures (`capture-pane -p -J`, control
#   characters replaced) at 100, 54, 40, 30, 24, 20, 16 and 12 columns and
#   pane heights 30, 12, 10, 8 and 6. Footer openings from github-copilot,
#   openrouter and groq runs.
# - The trust question, the input and editor dialogs (an extension raising
#   `ctx.ui.select`, `confirm`, `input` and `editor`), the first-run gate
#   (empty `HOME`, `PI_EXPERIMENTAL=1`) and the login dialog: 100, 54, 40, 30,
#   24 and 20 columns at pane height 30.
# - The update notice pi draws above its composer when a newer pi exists
#   (no `--offline`, as `amx new` starts pi): 120x40, 100x30, 80x24 and 40x24.
#   Its borders are the composer's, so a rule stands on the rows that fit its
#   window (`Rule::holds` in src/rules.rs).
# - Re-measured on 0.85.1 at 100, 54, 40, 30, 24 and 20 columns, height 30.
#   Two changes, noted at their rules: the working indicator moved into the
#   composer's top border (`spinner`), and the model and thinking selectors
#   spell their cancel key the way the login dialog does (`login`).
#
# Every rule asks for twenty columns of pi's composer border, the one thing
# that marks the pane as pi's: without it `↑↓ navigate` and `Working...` are
# strings any program prints. At 16 and 12 columns the border is that narrow,
# so pi reads `unknown` below 20 columns, the narrowest pane amx's own tiling
# makes (four agents on 80 columns).
#
# A `within` bounds how far a rule's anchor sits from that border. The floor
# finds the TOPMOST row carrying a string, so an earlier copy in the agent's
# output widens the span and the rule goes quiet until that row scrolls off.
# Quiet is the safer failure: the alternative is `working` over an idle pi.

# ── The furniture ────────────────────────────────────────────────────────────
# pi's chrome at the bottom of a pane: the composer's two borders, what is
# staged between them, the working directory and the stats line.
# src/furniture.rs walks up over these so a card and `amx logs` show the
# agent's rows without the vendor's.
#
# `mode` is what the last row, the stats line, opens with. Each part of that
# line appears only when it has a value and pi truncates it from the right, so
# the first part present survives. Three openings measured:
#
#   $0.000 (sub) 0.0%/264k (auto)          (github-copilot) gpt-5-mini • high
#   0.0%/1.0M (auto)                (openrouter) ~google/gemini-flash-latest • high
#   ↑1.5k ↓69 R1.3k CH90.3% $0.001 (sub) 0.5%/264k (auto)   (github-copilot) …
#
# A subscription provider before its first turn, an API-key provider before
# its first turn, and any session after one. `$0.` because pi prints each bash
# tool call as ` $ cmd (timeout 10s)`. `0.0%/` because the percentage leads
# only before the first turn, where it is zero. A first turn whose input is
# all cache reads opens on `R` and is not covered; that screen keeps its
# chrome. `↑` also opens every dialog's hint row, which is harmless since pi
# draws its footer under dialogs too.
#
# `spinner` is empty and `frames` carries the anchor. pi's status row is a
# braille frame, a space and one of four messages, one of them written by
# extensions, so the ten frames are all the four share. They are read at the
# head of a row, or past the rule of a border they are drawn into. Since
# 0.85.1 the working message sits in the composer's top border and goes with
# it; the frames still find the compaction and retry rows above the box.
#
# Two measured costs. An output row that opens with a frame and sits one blank
# row above the box is cut as the status line. A wrapped message keeps its
# frame on its first row while the walk reads the last, so at 40 columns and
# below compaction and retry rows stay on the card.
#
# `statusline` is exactly 1: the footer is always the working directory then
# the stats line, with nothing between them and the box. `bottom` is 1: the
# border never wraps, confirmed down to 12 columns. An extension status
# (`ctx.ui.setStatus`) adds a row under the stats line; then no anchor is found
# and the screen keeps every row.
#
# `thinking` is the row pi draws while it reasons with thinking hidden
# (`hideThinkingBlock`, the `hiddenThinkingLabel` default), read in 0.85.1's
# `assistant-message.js`.
[furniture]
mode = ["↑", "$0.", "0.0%/"]
spinner = []
frames = ["⠋", "⠙", "⠹", "⠸", "⠼", "⠴", "⠦", "⠧", "⠇", "⠏"]
thinking = ["Thinking..."]
rule = "─"
statusline = 1
bottom = 1

# The first-run gate: with no `settings.json` pi asks for a theme, then whether
# to share usage data, before it draws a session pane. The box is drawn at the
# top of the pane with no composer, working directory or stats line. Ordered
# before `dialog`, which also claims its `↑↓ navigate` hint row.
#
# `welcome to pi,` is the banner on both steps and on no other screen, whole at
# all six widths. The hint row is unusable: `skip setup` and
# `escape/ctrl+c skip` break at different widths on the two steps.
#
# No `within`: the box sits at the top, so on a pane taller than the box the
# top border is out of the floor and a window from the bottom border would
# measure empty pane. (7 rows from border to banner when the box fills the
# pane.)
#
# `not_below` tells the screen from a quotation of it: pi draws no footer under
# this box, so a stats line below the banner means quoted text. The strings are
# the `[furniture]` openings minus `↑`, which is on this screen's hint row. A
# quotation above a footer truncated to `↑1.5k ↓69 R1.3k CH90....` is still
# claimed.
#
# The analytics step wraps past the pane: at 30 columns the top border is gone,
# at 20 the banner too, and the screen falls to `dialog` (waiting, question).
#
# `asks` is the sentence above the arrow: pi marks the current choice with `→ `
# and numbers nothing. `marks` reads the choices, so the question is read above
# the whole run and a moved cursor does not change it. `setup` tells `doctor`
# the screen gates the run and only a person gets past it; `first_time_setup`,
# `project_trust`, `folder_trust` and `login` carry it.
[[rule]]
name = "first_time_setup"
state = "waiting"
kind = "question"
setup = true
all = ["welcome to pi,", "────────────────────"]
not_below = ["$0.", "%/"]
asks = { above = "→" }
marks = "→"

# The `/trust` selector: whether to trust this folder. Ordered before `dialog`,
# which shares its box and hint row. Measured with `/trust` in a folder with a
# `.pi/settings.json`, run with `--offline --no-session --approve` so nothing
# was saved. The box holds `Project trust`, the folder in full, `Saved
# decision: none`, `Current session: trusted`, the choices `Trust`, `Trust
# parent folder (...)` and `Do not trust`, and the hint row.
#
# `project trust` is the fixed title, on no other screen, whole at all six
# widths. The hint row's `enter save` breaks at 24 and 20 columns. `any` needs
# one of the selector's own body rows beside the title.
#
# `within` 7 is the widest span measured, border to `Saved decision:`. With a
# 62-character worktree path it was 5 at 100 columns, 6 at 54 and 40, and 7 at
# 30. A deeper path wraps further and the screen falls to `dialog`, read as a
# question whose text is the saved-decision rows. This is pi's tallest box: at
# 24 and 20 columns with that path its top border is above the floor, so no
# width below 30 is guaranteed (a 43-character path still read at 24).
#
# A quotation of this screen is claimed too: pi draws its footer under both,
# so `not_below` has nothing to find.
#
# `asks` reads the title and the folder under it; reading above the choices
# would take the saved-decision rows. `marks` puts the three choices on the
# record, numbered by amx in pi's order. `setup` as above; kind `trust` is what
# lets `doctor` offer to answer it.
[[rule]]
name = "project_trust"
state = "waiting"
kind = "trust"
setup = true
all = ["project trust", "────────────────────"]
any = ["saved decision:", "current session:"]
within = 7
asks = { sentence = "project trust" }
marks = "→"

# The trust question pi asks on its own before a turn, in a folder with a
# `.pi/` and no saved decision. `core/project-trust.ts` builds it as a
# `ctx.ui.select`, so it is the dialog box with pi's own words in it and
# `project_trust` does not match it (docs/pi-screens.md). Measured on 0.85.1
# at 100 and 20 columns, height 30, `pi --offline --no-session`. The box holds
# `Trust project folder?`, the folder, `This allows pi to load .pi settings
# and resources, ...`, five choices and the hint row.
#
# `trust project folder?` is the fixed title, on no other screen. `any` needs a
# body row too, so a quoted title alone does not match; neither row is on the
# `/trust` selector. `asks` reads the title and the folder; above the arrow is
# the sentence about consequences.
#
# `marks` numbers the five choices in pi's order: `Trust`, `Trust parent folder
# (...)`, `Trust (this session only)`, `Do not trust`, `Do not trust (this
# session only)`. The selector ignores `1`, `2`, `y` and `n`, `Up` and `Down`
# move one row and clamp, and `Enter` takes the marked row, so the numbers are
# amx's own. Wrapped label rows start left of the marked row's text and are
# joined back on.
#
# No `within`: the folder and sentence wrap deeper on a deeper tree. At 20
# columns the title is above the floor and the screen falls to `dialog`.
# `setup` and kind `trust` as above; `crate::trust` answers it with
# `--approve` when the config allows.
[[rule]]
name = "folder_trust"
state = "waiting"
kind = "trust"
setup = true
all = ["trust project folder?", "────────────────────"]
any = ["do not trust", "this allows pi to load"]
asks = { sentence = "trust project folder?" }
marks = "→"

# A dialog a tool call raised (`ctx.ui.select`, `ctx.ui.confirm`), drawn inside
# the composer box in place of the editor with the footer under it as usual.
# Measured on 0.84.4 with an extension gating the bash tool: select at 100 and
# 20 columns, confirm at all six widths.
#
#    Run echo hi?
#
#    → Allow once
#      Allow always
#      Deny
#
#    ↑↓ navigate  enter select  escape/ctrl+c cancel
#
# The hint row wraps and every term after the first breaks somewhere (`enter
# select` at 20 columns, `escape/ctrl+c cancel` at 40), so the anchor is its
# opening, `↑↓ navigate`, whole at all six widths.
#
# A quotation of a dialog is claimed too: pi draws its footer under both, so
# `not_below` has nothing to find. A false match reads a working agent as
# waiting, and `send` refuses it. No `within`: the box height is the caller's
# (a row per choice); at 20 columns eight rows already sit between the border
# and the hint.
#
# `asks` is the sentence above the arrow. `marks` reads the run of rows the
# arrow is in and numbers them in pi's order; unmarked choices carry two spaces
# where the marked one has the arrow, and a wrapped continuation starts further
# left. With `marks` the question is read above the run, so a moved cursor
# does not change it. A confirm's message, on the row under its title, is read
# with the title as one sentence: `Push to origin? This rewrites the remote
# branch.`
#
# On 0.84.4 a tool-call dialog had `Working...` above the box. 0.85.1 keeps the
# indicator in the editor the dialog replaces, so no frame shows, but a
# compaction row above a dialog still would. Order keeps `spinner` off a
# blocked screen, so this rule comes first.
[[rule]]
name = "dialog"
state = "waiting"
kind = "question"
all = ["↑↓ navigate", "────────────────────"]
any = ["escape/ctrl+c", "enter select"]
asks = { above = "→" }
marks = "→"

# `ctx.ui.editor`: a caller asking for a block of text. The dialog box with a
# second box inside it for the text, and the hint row `enter submit
# shift+enter/ctrl+j newline  escape/ctrl+c cancel  ctrl+g external editor`.
# Measured on a fresh `--offline` boot at all six widths. Without this rule and
# `input`, a gate written with these calls read `unknown` (docs/pi-screens.md).
#
# `enter submit` opens the hint row and is whole at all six widths.
# `shift+enter/ctrl+j` (whole at all six) tells it from `input`; the full
# `shift+enter/ctrl+j newline` breaks at 24 and 20, and `ctrl+g external
# editor` at 40 and below. Every anchor here is on the `input` screen too, so
# this rule comes first. No `within` and no quotation check, as for `dialog`.
#
# `asks` is the sentence above the hint row, the title: the empty text box
# between them is border glyphs only and is skipped. Once text is typed there,
# this reads the text instead.
[[rule]]
name = "editor"
state = "waiting"
kind = "question"
all = ["enter submit", "shift+enter/ctrl+j", "────────────────────"]
asks = { above = "enter submit" }

# `ctx.ui.input`: a caller asking for one line. The dialog box with a `>` row
# for the line and the hint row `enter submit  escape/ctrl+c cancel`. Measured
# as `editor` was.
#
# Only `enter submit` is usable: `escape/ctrl+c cancel` breaks at 20 columns
# and every dialog carries it. That makes this the weakest rule here, so it
# sits under `editor`.
#
# `asks` is the sentence above the `>`, the title: one row at 100, 54 and 40
# columns, two at 30, 24 and 20. Typing lands on the `>` row, so the reading
# holds once somebody types. The `>` is found wherever it sits, so numbered
# rows in the agent's output above the box do not hide the question.
[[rule]]
name = "input"
state = "waiting"
kind = "question"
all = ["enter submit", "────────────────────"]
asks = { above = ">" }

# A turn is running. pi 0.85.1 draws the working indicator in the composer's
# top border: `── `, the frame, the message, a space, and the rule to the edge.
#
#   ── ⠼ Working ───────────────────────────────────────────
#
# Before 0.85.0 it was a row of its own, `⠼ Working...`, two rows above the
# box; the other three kinds still are. The frame cycles through all ten glyphs
# (all seen over 80 captures at eight a second); the message does not. At 100,
# 54, 40, 30, 24 and 20 columns the word never wraps and the rule after it is
# 87 wide at 100 and 7 at 20, so at 20 the twenty rules this asks for are the
# bottom border, inside the window. pi keeps the indicator up for the whole
# turn, so nothing here depends on how long a screen has held still.
#
# pi draws one status row and swaps which of four kinds is on it:
#
#    ⠼ Compacting context... (escape to cancel)    /compact, request held open
#    ⠙ Retrying (1/3) in 2s... (escape to cancel)  a 503 from every call
#    ⠙ Reviewing the diff                          ctx.ui.setWorkingMessage
#
# Driven against a local provider that held the request open or answered 503.
# `setWorkingMessage` replaces the message with any text, so no word is shared
# and `any` is the ten frames.
#
# `within` 4 is the widest span measured. With the word in the border it is 2
# at every width. Compaction and retry messages wrap with the frame on their
# first row: 2 at 100 and 54 columns, 3 at 40 and 30, 4 at 24 and 20. A longer
# message makes the rule go quiet. Four rows also claim `!cmd`'s own box,
# `⠧ Running... (escape/ctrl+c to cancel)` three rows above a border (seen
# with `!sleep 20`), which reads `working`; the pane is busy, so that stands.
#
# `any_opens` requires the frame to open its row or follow a border's rule. A
# tool's progress line with a frame mid-row, two rows above the composer, read
# `working` over an idle pi without it.
#
# On 0.84.4 the spinner row was the first a short pane lost: kept at 8 rows,
# gone at 6. On 0.85.1 it is in the border; short panes were not re-driven.
[[rule]]
name = "spinner"
state = "working"
all = ["────────────────────"]
any = ["⠋", "⠙", "⠹", "⠸", "⠼", "⠴", "⠦", "⠧", "⠇", "⠏"]
any_opens = true
within = 4

# pi waiting for a provider's API key: where `/login` ends for a provider
# signed into with a key, and the pane of a pi with no login at all. The box
# replaces the composer and the footer stays. Measured at all six widths via
# `/login` to a key-based provider. At 100 columns:
#
#    Warning: No models available. Use /login to log into a provider via OAuth
#    or API key. See:
#
#   ────────────────────────────────────────────────────────
#    Login to Cerebras
#
#    Enter Cerebras API key
#   >
#    (escape/ctrl+c to cancel, enter to submit)
#   ────────────────────────────────────────────────────────
#
# The anchor is `(escape/ctrl+c to`, parenthesis included. 0.85.1's model and
# thinking selectors end their hint row `Escape/Ctrl+C to cancel` (0.84.4 wrote
# `Esc to cancel`), so the key alone read `/model` as this gate. No other hint
# row pi draws opens with a parenthesis. Whole at all six widths on 0.85.1: the
# row breaks elsewhere and never splits the parenthesis from the key.
#
# Ordered under `spinner`: `!cmd`'s box carries the same fragment three rows
# above the composer, and the frame in front of it is what tells them apart. A
# login dialog with a turn running behind it would read `working`; no measured
# state produces one.
#
# The title `Login to ` is not the anchor: the model selector's first row says
# `Use /login to add providers.`, and a fragment that selector lacks is the
# stronger claim.
#
# `within` 6 is the widest span measured: 5 at 100, 54, 40, 30 and 24 columns,
# 6 at 20 where the hint wraps. Without this rule the screen read `idle`, the
# worse error on pi, since `send` types into whatever widget is up.
#
# `asks` is the sentence above the `>` row, as for `input`. The account sign-in
# shape (a URL and a device code) was not driven. `setup`: a pi with no key has
# no turn under this screen until somebody types.
[[rule]]
name = "login"
state = "waiting"
kind = "question"
setup = true
all = ["(escape/ctrl+c to", "────────────────────"]
within = 6
asks = { above = ">" }

# pi at rest: an empty box and the two footer rows. Also what names a freshly
# booted pi, which draws its banner, box and footer and nothing else.
#
# `any` is the `[furniture]` stats-line openings as substrings, plus `↑` on its
# own: at 24 columns a session with cache stats truncates to `↑1.5k ↓69 R1.3k
# CH90....` and loses `%/`. Below 20 columns the border is gone and this rule
# is silent.
#
# `within` 4 and `apart` 4 fix the span at exactly 4 rows: top border, staged
# row, bottom border, working directory, stats line. pi draws every selector
# between the same two borders, so the former window of 8 read `/model`,
# `/scoped-models`, `/tree`, `/fork`, the theme and show-images selectors as a
# prompt (docs/pi-screens.md). `idle` is the worse error on pi: `send` types
# into whatever widget is up.
#
# `apart` covers a box taller than the floor, where the only border left is
# the bottom one and the span is 2. Measured at 100 columns, height 30: the
# show-images selector spanned 5 alone and 7 under `!seq 1 60` output (whose
# box leaves a bottom border on the pane), and `/model` spanned 2. All three
# read `unknown`.
#
# Cost: between `amx send` pasting into the box and submitting, the staged
# rows exceed the window and the pane reads `unknown`.
#
# `quiescent`: this rule ends a turn the record says is running only after the
# screen holds still across consecutive looks. `spinner` claims running turns
# outright, so the gate is for status lines this file does not name. From a
# state with nothing outstanding it decides at once, which names a parked agent
# within ten seconds.
[[rule]]
name = "prompt"
state = "idle"
quiescent = true
all = ["────────────────────"]
any = ["↑", "$0.", "%/"]
within = 4
apart = 4
