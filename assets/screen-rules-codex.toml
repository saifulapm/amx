# Screen rules for codex, read where its hooks go quiet: the gates codex draws
# before a session, an approval box, a question form, and a turn ended by Esc or
# an API error (codex sends no Stop for either). A screen no rule claims reads
# `unknown`. Matching is documented in assets/screen-rules.toml.
#
# Every anchor was read off a live codex-cli 0.157.1 run with `--no-daemon` on
# its default alternate screen, captured with `capture-pane -p -J` at 220, 100,
# 54 and 24 columns and 40 rows. The captures are in tests/codex/screens,
# src/rules.rs tests every rule against them, and docs/codex-screens.md says how
# each screen was raised. The source (tag rust-v0.157.1) was used only to find
# the screens.
#
# amx launches codex without `--no-alt-screen`, so the composer is pinned to the
# bottom. With `--no-alt-screen` it floats up the pane and the idle footer has
# no `? for shortcuts` row.
#
# No [furniture] table: codex draws no composer box for src/furniture.rs to walk
# up to, so a codex pane keeps every row. Its bottom rows are the composer
# (`› `), a blank row, a status line and a footer row.

# Update prompt. codex shows it only for a standalone install whose CODEX_HOME
# version.json names a newer version, and skips it when the argv carries a
# prompt. Both anchors are whole at every width; the history banner says
# `update available!` and blocks nothing. Drawn at the top of the pane, so no
# `within`. A setup gate: the person decides whether to update.
[[rule]]
name = "update"
state = "waiting"
kind = "question"
setup = true
all = ["update available ·"]
any = ["skip until next"]

# Hooks review, drawn at startup when a hook codex reads is new or changed since
# it was trusted. amx's groups raise it on the first start after `amx setup
# codex` unless setup wrote their trusted hashes. The count line varies (`1 hook
# is`, `11 hooks are`), so it is no anchor. `trust all and` is whole everywhere.
[[rule]]
name = "hooks_review"
state = "waiting"
kind = "question"
setup = true
all = ["hooks need review"]
any = ["trust all and"]

# Folder trust, for a directory with no trust entry in config.toml.
# `-c 'projects."<dir>".trust_level="trusted"'` on the argv does not skip it.
# Both anchors are whole at every width. `enter continue ·` is unused because
# the update prompt's footer has it too.
[[rule]]
name = "folder_trust"
state = "waiting"
kind = "trust"
setup = true
all = ["trust this folder?"]
any = ["trust and continue"]

# Working-directory prompt, raised by `codex resume <id>` from a directory other
# than the session's last (`fork` draws it too, by source, not measured). The
# title is no anchor: at 24 columns the screen is 26 rows and the title falls
# outside the floor. `session = latest` opens the row under it and stays inside.
[[rule]]
name = "cwd_prompt"
state = "waiting"
kind = "question"
setup = true
all = ["session = latest"]
any = ["use session", "use current"]

# Command approval, raised with `--sandbox read-only` and a prompt that needs
# escalation, drawn with no composer or footer under it. Both anchors are whole
# at every width; the question is the sentence the title row starts. Only the
# command box was measured, so the edit, network and permissions boxes are not
# claimed.
[[rule]]
name = "approval"
state = "waiting"
kind = "permission"
all = ["press enter to confirm"]
any = ["yes, proceed"]
asks = { sentence = "would you like to" }

# A `request_user_input` form, raised with `--enable
# default_mode_request_user_input` (off outside plan mode). The footer is one
# row at 220 and 100 columns, two at 54 and three at 24, with both anchors whole
# and at most one row apart. Its `esc to interrupt` has no bracket or bullet, so
# the working rule's anchors miss it.
[[rule]]
name = "question"
state = "waiting"
kind = "question"
all = ["tab to add notes"]
any = ["enter to submit"]
within = 2

# A running turn: `• Working (7s • esc to interrupt)` above the composer. The
# header word becomes a reasoning summary mid-turn, so the anchors are the tail:
# `to interrupt)` at 220 to 54 columns, `• esc to` at 24, where the row is cut.
# Past a minute the time reads `1m 05s`, which may cut `esc to` off a 24-column
# row (not captured). Background terminals, hook status and queued or steered
# messages leave both anchors in place.
[[rule]]
name = "working"
state = "working"
any = ["to interrupt)", "• esc to"]

# The composer with nothing staged, idle or after a turn, including one that
# ended on an API error. A running turn draws the same footer, so the working
# rule comes first. The row is empty with text staged at idle, and briefly
# replaced after an Esc or a first Ctrl+C.
[[rule]]
name = "prompt"
state = "idle"
quiescent = true
all = ["? for shortcuts"]

# A turn ended by Esc: `■ Conversation interrupted - tell the model what to do
# differently.` codex moves any Tab-queued message back into the composer, which
# empties the prompt rule's footer. The anchor is whole at every width and stays
# in the history, so a later screen no rule above claims still reads idle.
[[rule]]
name = "interrupted"
state = "idle"
quiescent = true
all = ["■ conversation"]
