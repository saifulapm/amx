# What amx can recognise on an agent's screen.
#
# When the hooks have gone quiet, a reader looks at the bottom of the pane and
# matches it against these rules. This file is the whole of what amx knows how
# to see on a claude pane: its four blocking prompts, the line it spins while a
# turn runs, the furniture it leaves under an idle prompt, and the sentences it
# sends about a dialog it will not describe. It is deliberately small. A screen
# no rule claims is reported as `unknown` rather than guessed at — a missing
# rule costs a row that says "I can't tell", a sloppy one costs a lie.
#
# Rules are ORDERED: the first whose conditions hold decides, so the more
# specific screens come first. A rule holds when every string in `all` appears
# and — if `any` is given — at least one of those appears too. Matching is done
# against the capture with its control characters replaced and its case folded,
# so a colour change in the middle of a word cannot hide a rule.
#
# ── The anchor law ───────────────────────────────────────────────────────────
# Every string here was read off a live claude, and where it was measured is
# recorded beside it. Two things this law has cost, and one it protects:
#
# A MULTI-WORD ANCHOR DIES TO WORD WRAP AT SOME WIDTH. The floor keeps the
# rows separated by newlines, so a phrase the vendor wrapped across two rows
# can never match as one substring. `you trust` breaks between `you` and
# `trust` at 61–67 columns — three panes across a 200-column terminal, a shape
# amx's own tiling produces. `shift+tab to cycle` is gone below 46 columns and
# absent in manual mode at every width. Anchor on the fragment the vendor
# cannot break: a single word, or the fragment a row OPENS with.
#
# A STRING RECOGNISED FROM A REFERENCE TREE IS NOT A MEASUREMENT. An earlier
# ruleset anchored `working` on `esc to interrupt` and `idle` on
# `? for shortcuts`, both taken from source rather than from a running vendor.
# Measured against claude v2.1.226 on 2026-08-12: zero occurrences across 60
# mid-turn captures and the idle screen. An agent parked at its prompt read
# `unknown` for 183 consecutive samples, and turns flapped working → unknown →
# working.
#
# So: any string recognising the vendor's UI is measured across its MODES and
# WIDTHS, with the capture and the date recorded beside it, or it is wrong.

# ── Whose screens these are ──────────────────────────────────────────────────
# claude's, and nobody else's: every string below is this vendor's own and
# means nothing on anybody else's pane. Which document a reader uses is not
# written here — src/vendor/claude.rs points at this file, and the program an
# agent command runs is what finds that entry. One document per vendor.

# ── The sentences that stand in for a question ───────────────────────────────
# What the vendor sends about a dialog it will not describe. A record can end
# up holding one of these where the question should be, and a row carrying one
# says an agent is waiting — which is what a row carrying nothing says, and it
# says it in words that read like an answer, so a caller stops looking and a
# person reads the pane themselves. A reader drops them and goes to the screen.
#
# Measured against claude 2.1.240 on 2026-08-24, read out of the binary's own
# dialog host: six seconds after a dialog goes up it fires a
# `permission_prompt` notification whose whole message is that dialog's title,
# and the title it gives every tool dialog is `Claude needs your permission` —
# no tool, no command, nothing anybody could weigh. A tool permission box has a
# notifier of its own on the same six-second timer, and that one sends `Claude
# needs your permission to use <tool>`. Which of the two lands last is the
# vendor's business, so these are matched as WHOLE SENTENCES and never as the
# start of one: the sentence that names the tool is one a caller can act on.
#
# The idle nudge is the other, and it is not about a question at all: the
# vendor sends it about a session with nothing open on it. One that says so in
# its own payload is turned away where hooks are folded, but an older vendor
# sends it with no type on it, and records outlive the amx that wrote them.
placeholders = [
  "Claude needs your permission",
  "Claude is waiting for your input",
]

# ── The furniture ────────────────────────────────────────────────────────────
# The chrome claude draws under every pane it has the room for, as the anchors
# that find it: composer box, statusline, mode footer, and the line it spins
# while a turn runs. `src/furniture.rs` walks up from the bottom of a capture
# over these, so that a card and `amx logs` show the rows an agent earned and
# not the rows the vendor drew under them.
#
# `mode` is the footer's opening glyphs and nothing after them: the words
# truncate as the pane narrows and are gone by 30 columns, while these two are
# present in all six permission modes at every width from 24 to 220 — the same
# measurement the rules below anchor on, and it is written out under
# `permission_prompt`.
#
# `spinner` is the two punctuation fragments the turn spinner always carries,
# the ellipsis before its elapsed time and the separator after it, both on the
# one row. Punctuation rather than any word, so the vendor renaming its gerunds
# does not move the anchor, and neither fragment is on the line it leaves
# behind when the turn is over — see the `spinner` rule below for the samples.
#
# `rule` is the glyph the composer's box is drawn with. `statusline` is how
# many rows of it the walk will step over to reach that box's bottom border: a
# margin over the one row measured, not a measured maximum, and the cap is what
# keeps the walk off the transcript. `bottom` is how many rows the bottom
# border can take — one at 22 columns and wider, which is every pane 2.1.237
# draws a footer in at all, and two below that, where the box is wider than the
# pane and wraps.
#
# Measured against a live claude 2.1.237 on 2026-08-21 at 100, 30, 24, 23, 22,
# 21 and 20 columns and at pane heights 30, 12, 10, 9 and 8, with the composer
# empty and with three and ten rows staged in it.
[furniture]
mode = ["⏵⏵", "⏸"]
spinner = ["… (", "s · "]
rule = "─"
statusline = 2
bottom = 2

# claude asks this before its prompt exists, so nothing else it draws can be
# underneath — which is why it comes first.
#
# Measured against v2.1.226 on 2026-08-12 at 220 and 54 columns, reconfirmed
# byte for byte against v2.1.237 on 2026-08-21 at the same two widths, and
# again against v2.1.240 on 2026-08-24 at 220 columns:
#
#   Quick safety check: Is this a project you created or one you trust? (Like
#   your own code, …). If not, take a moment to review what's in this folder
#   first.
#   ❯ 1. Yes, I trust this folder
#     2. No, exit
#   Enter to confirm · Esc to cancel
#
# The wording drifted between 2026-08-11 and 2026-08-12 — a `Quick safety
# check:` prefix appeared, the guidance merged onto one row — and the single
# word `trust` survived it. At 54 columns the vendor wraps the sentence between
# `you` and `trust`, so the two-word anchor this used to carry would have gone
# silent exactly where amx tiles its own wall.
#
# The word alone is not a prompt: an agent discussing a registry it trusts
# writes it every day. What makes it a prompt is the widget — `❯ 1.`, the
# selection marker in front of the first option, which claude draws only in a
# choice box — or the box's own confirm footer. `within` says the two have to
# be in the same box rather than merely on the same screen: 16 rows is the
# widest one measured, the trust screen at 54 columns, where eleven rows of
# wrapped guidance sit between the word and the marker.
#
# `asks` is where the question itself is, once the rule has claimed the screen.
# Under this one's question sit a sentence about what claude will be able to do
# and a link to the security guide, and neither of those is being asked, so the
# question is the sentence the rule's own anchor is on and not the one above
# the choices.
[[rule]]
name = "folder_trust"
state = "waiting"
kind = "trust"
all = ["trust"]
any = ["❯ 1.", "enter to confirm"]
within = 16
not_below = ["⏵⏵", "⏸", "shift+tab to cycle", "? for shortcuts"]
asks = { sentence = "trust" }

# claude's permission box, measured live against v2.1.226 on 2026-08-12 at 220
# columns. It takes forcing: a machine whose claude runs in auto mode approves
# every probe without asking, and `--permission-mode manual` with an `ask` rule
# for `Bash` is what finally produced one.
#
# Reconfirmed against v2.1.237 on 2026-08-21 at 220 columns, this time without
# forcing: cycling to manual mode with shift+tab and asking for an edit drew
# the same box, unchanged, for a Write, an Edit, and a Bash command in turn —
# `Do you want to create LICENSE?`, `Do you want to make this edit to
# README.md?`, `Do you want to proceed?`. The tool differs the wording after
# `do you want to`, which is exactly the fragment this rule does not anchor on.
#
#   ────────────────────────────────────────────
#    Bash command
#      rm -f b.txt
#    Permission rule Bash requires confirmation for this command.
#    Do you want to proceed?
#    ❯ 1. Yes
#      2. No
#    Esc to cancel · Tab to amend · ctrl+e to explain
#
# Two things that capture settles: the box is a full-width rule with the
# request under it and not a `╭─╮` box, and it draws NO mode footer.
#
# ── Why a bare `❯` is not evidence, and `not_below` is ───────────────────────
# `❯` used to stand in `any` as the affordance. It is a no-op: `❯` is the
# composer chevron and it is on every screen this vendor draws, mid-turn and
# idle alike. With it, each rule collapsed to one generic substring over the
# agent's own visible output, and an ordinary answer carrying "do you want to"
# above a markdown numbered list was ruled `waiting` — with a question invented
# from a sentence that was not one. Worse than `unknown` twice over: `send`
# then refuses, and a caller branching on the blocked exit code answers by
# typing a key into a running turn.
#
# But no anchor string can tell a widget from a QUOTATION of that widget. An
# agent that pastes another agent's `capture-pane` as a tool result — which is
# what amx's own callers do — reproduces the box character for character, and
# one plain English sentence does it too: "pick the folder you trust, press
# Enter to confirm" carries both of the trust rule's fragments on one row.
#
# What a quotation cannot reproduce is the vendor's LAYOUT. claude draws no
# input box under a blocking prompt: both blocking screens end at their confirm
# footer with nothing beneath. Quoted chrome is always sitting in a turn, so
# the composer and the mode footer are drawn below it. A modal choice and an
# input box are mutually exclusive states of the same program, so a widget with
# a composer under it is text ABOUT a widget.
#
# `not_below` names the mode footer, not the composer's own row: `❯` is on that
# row and also in front of every option, and `send` can leave `❯ 1. …` staged
# in the composer itself, so no content test on that row tells an input box
# from a widget.
#
# The footer is anchored on the glyph it opens with. Measured across six modes
# and ten widths, 24 to 220 columns, on 2026-08-12:
#
#   ⏵⏵ auto mode on (shift+tab to cycle) · ← for agents
#   ⏵⏵ accept edits on (shift+tab to cycle) · ← for agents
#   ⏸ plan mode on (shift+tab to cycle) · ← for agents
#   ⏸ manual mode on · ← for agents               ← no hint at any width
#   ⏵⏵ bypass permissions on (shift+tab to cycle) · ← for agents
#   ⏵⏵ don't ask on (shift+tab to cycle) · ← for agents
#
# and the vendor truncates from the right as the pane narrows: in auto mode the
# hint is intact at 46 columns, `(shift+tab to` at 40, `(shift+tab` at 34, gone
# by 30. Four agents on a 160-column terminal is 40 columns each. `⏵⏵` and `⏸`
# are present in all six modes at every width, contiguous in the capture, and
# on neither blocking screen — verified against a live permission box and a
# live trust screen, neither of which carries the glyph on any of its 49 rows.
# The hint stays as an alternative: it costs nothing and an older vendor may
# print it where the glyph is absent.
#
# Reconfirmed against v2.1.237 on 2026-08-21: auto, manual, accept-edits and
# plan mode all print the same six lines verbatim, and the truncation points
# hold at the three widths re-checked — intact at 46 columns, `(shift+tab to`
# at 40, gone by 30. Bypass-permissions and don't-ask were not re-driven this
# round; nothing about this vendor bump touched the footer's wording.
#
# `asks` again: what sits above this screen's question is what the request is
# about — the tool, its arguments, the rule that stopped it — and that is not
# what is being asked, so the question is the row the anchor is on.
[[rule]]
name = "permission_prompt"
state = "waiting"
kind = "permission"
all = ["do you want to"]
any = ["❯ 1.", "esc to cancel"]
within = 16
not_below = ["⏵⏵", "⏸", "shift+tab to cycle", "? for shortcuts"]
asks = { sentence = "do you want to" }

# The third blocking prompt: the menu claude's AskUserQuestion tool draws.
# Measured against v2.1.229 on 2026-08-15 in five modes at eight widths from 24
# to 191 columns — forty captures. The sixth mode is a vendor fact rather than
# a gap: `dontAsk` blocks the tool outright, so the screen it leaves is an
# ordinary idle one.
#
#    ☐ Indentation
#   Should this project be indented with spaces or tabs?
#   ❯ 1. Spaces
#        Indent with spaces (most common default).
#     2. Tabs
#     3. Type something.
#   ──────────────────────────────────────────────────────
#     4. Chat about this
#   Enter to select · ↑/↓ to navigate · Esc to cancel
#
# Neither rule above can reach it — `trust` and `do you want to` are both
# absent — and `all` decides, so without this rule the floor matched nothing
# and an agent parked on a menu read `unknown` with no question on its row.
#
# `enter to select` is intact at every one of those forty cells, because it is
# what the row OPENS with: this footer wraps rather than truncating. At 24
# columns it reads `Enter to select · ↑/↓ to` / `navigate · Esc to` / `cancel`,
# which is also why `esc to cancel` rides in `any` as an alternative and never
# as the anchor.
#
# `within` is 24 here rather than 16 because the box's height is the agent's
# own choice — the tool names its options and writes their descriptions — and
# at 24 columns eighteen rows already sit between `❯ 1.` and the footer. There
# is no height a bound can be sized to, so the window is the floor's own and
# the weight is carried by `not_below`, which does not depend on the box's
# height. Not one of the forty captures carries a mode-footer glyph anywhere.
#
# Reconfirmed against v2.1.237 on 2026-08-21 at 220 columns: a real
# AskUserQuestion call (`Which license should the LICENSE file contain?`)
# drew the same shape — checkbox, question, numbered options, separator,
# `N. Chat about this`, and the footer `Enter to select · ↑/↓ to navigate ·
# Esc to cancel` unchanged to the letter. The eight-width, five-mode matrix
# above is a rendering fact about how this vendor wraps text, not wording it
# could silently change; it was not redriven this round.
#
# ── The other four shapes this one tool draws ────────────────────────────────
# The screen above is the tool's plainest shape. Driven live against v2.1.240
# on 2026-08-24 at 220, 80, 54, 40 and 24 columns, the same tool also draws a
# checkbox list, a strip of question tabs, a note field beside a preview, and a
# free-text `Other` row — captures, payloads and keystrokes in
# docs/question-shapes.md. This rule came through all four unchanged, and the
# reason is the anchor: the footer's middle term is `↑/↓ to navigate` on one
# question, `Tab/Arrow keys to navigate` on several, and gains `n to add notes`
# and `ctrl+g to edit in <editor>` besides — but every one of them still OPENS
# with `Enter to select`, at every width measured. `not_below` was never wrong
# on any of the forty-odd captures.
#
# What the rule cannot do on those shapes is read what is on them, and that is
# a matter for whatever owns the reading rather than for a string here:
#
#   * a checkbox choice draws as `❯ 1. [ ] Logging`, so its label comes off the
#     row with the box glued to it, and an answered tab marks its choice with a
#     trailing ` ✔`;
#   * the unnumbered row a checkbox screen draws under its `Other` row reads
#     `Submit` when no question follows and `Next` when one does, measured at
#     220 columns on 2026-08-24. It names where the tab leads, so neither word
#     tells a reader which shape it is on;
#   * a previewed question puts the preview box on the SAME rows as the
#     choices, drops the `Other` row, and leaves `Chat about this` with no
#     number on it at all;
#   * a tab strip elides its headers as the pane narrows — `☐ St…` at 40
#     columns, the current tab's own header gone at 24 — so how many tabs there
#     are and what they are called is in the payload and nowhere else;
#   * the vendor pads the screen it drew rather than sitting at the bottom of
#     it. Measured on a 50-row pane: the box occupied rows 17 to 33 and left 17
#     blank rows under the footer, which put the floor's 24 rows seven rows
#     below the question. The rule still held, on `esc to cancel`, and the
#     question read back empty.
#
# Seen live again against v2.1.240 on 2026-08-25 at 220 columns, this time
# through amx rather than by hand: three agents started with `amx new`, one on a
# checkbox question, one on a plain menu and one on a call of three questions,
# and every capture while a menu was up read back `ask_menu` and `waiting`. The
# footer's middle term was `↑/↓ to navigate` on the two single-question calls
# and `Tab/Arrow keys to navigate` on the three-question one, and all three
# opened with `Enter to select`. What that round did find is that nothing on
# this screen distinguishes it from a permission box in the vendor's own
# EVENTS — a menu fires `PermissionRequest` and a `permission_prompt`
# notification of its own — which is why the rule claiming the screen now
# outranks a record that says `permission`. See docs/question-shapes.md § 6.
#
# ── The screen with no footer, which nothing here claims ─────────────────────
# Both shapes that need an explicit submit — a multi-select question, or more
# than one question — end on a review tab that draws `Review your answers`, the
# answers so far, `Ready to submit your answers?` and `❯ 1. Submit answers`,
# and NO footer of any kind. Measured at 220, 54 and 24 columns on 2026-08-24.
# `enter to select` is not on it, so this rule cannot reach it; `ready` without
# `execute` misses plan_approval; the mode footer a blocking prompt never draws
# misses idle_prompt. An agent one keystroke from finishing an answer therefore
# reads `unknown`. The anchor those captures support is `review your answers`,
# which is 19 columns, whole at every width measured, and the fragment its row
# opens with.
[[rule]]
name = "ask_menu"
state = "waiting"
kind = "question"
all = ["enter to select"]
any = ["❯ 1.", "esc to cancel"]
within = 24
not_below = ["⏵⏵", "⏸", "shift+tab to cycle", "? for shortcuts"]

# The fourth blocking prompt: the approval box claude's ExitPlanMode tool
# draws once a plan is ready. Measured against v2.1.237 on 2026-08-21 at 220,
# 54 and 24 columns, seen live by entering plan mode and asking for a plan:
#
#   Claude has written up a plan and is ready to execute. Would you like to
#   proceed?
#
#   ❯ 1. Yes, and use auto mode
#     2. Yes, manually approve edits
#     3. Tell Claude what to change
#        shift+tab to approve with this feedback
#
#   ctrl+g to edit in Kak · ~/.claude/plans/write-a-one-paragraph-plan-snug-russell.md
#
# Neither rule above reaches it: the sentence carries neither `do you want to`
# nor `enter to select`, and its own footer names the editor rather than
# offering `enter to confirm` or `esc to cancel`. Without this rule an agent
# parked on its own plan approval read `unknown`, with the question — accept,
# revise, or hand back control of the run — gone from the row.
#
# Both halves of the sentence break under this vendor's wrap, and at
# different widths: at 54 columns it splits between `to` and `execute.`, so
# `ready to execute` cannot anchor; at 24 columns it splits between `to` and
# `proceed?` instead, so `would you like to proceed` cannot either. What
# survives both is the pair of single words neither break touches — `ready`
# and `execute` land on the same row at every width measured, and `all` does
# not require its entries to share a row, only to be near enough for `within`
# to hold, which four rows of options comfortably are.
#
# The box ends at its own footer with nothing beneath, the same as the other
# three blocking screens, so `not_below` carries the same weight here: a
# quotation of this box would need to reproduce that absence too.
[[rule]]
name = "plan_approval"
state = "waiting"
kind = "permission"
all = ["ready", "execute"]
any = ["❯ 1."]
within = 16
not_below = ["⏵⏵", "⏸", "shift+tab to cycle", "? for shortcuts"]

# A turn is running. v2.1.226 spins one line just above the input box:
#
#   ✽ Nesting… (15s · still thinking with xhigh effort)
#   · Infusing… (2m 2s · ↓ 6.9k tokens)          (during a 40s Bash call)
#
# — a cycling glyph (`✻ ✽ ✢ ✶ · *`), a rotating gerund, and always `…` + ` (`
# + an elapsed `<n>s` + ` · `. Anchoring on the two punctuation fragments
# rather than on any word is what survives the vendor renaming the gerund,
# changing the glyph set, or swapping the detail after the `·`.
#
# What this must not match is the line claude leaves behind when the turn is
# over — `✻ Brewed for 1m 22s`, same glyph, no ellipsis and no parenthesis.
# That line sits on the idle screen, so a rule that matched it would report a
# finished agent as working forever.
#
# This is the weakest rule in the file: two punctuation fragments, no `within`,
# no `not_below`. The floor reads the bottom rows, so an agent's own output can
# in principle carry both fragments, and a wrong match here does not only
# mislabel a row — naming a screen as non-blocking also clears a pending
# question off it. It is the first rule to re-measure on a vendor bump.
#
# Re-measured against v2.1.237 on 2026-08-21, live across a thinking turn, a
# Bash call and an AskUserQuestion round: `✢ Forging…`, `✶ Forging… (9s ·
# thinking with xhigh effort)`, `· Forging… (22s · ↓ 1.3k tokens)`, `*
# Smooshing… (7s · thinking with xhigh effort)`, `✢ Smooshing… (31s · ↓ 1.8k
# tokens · thought for 1s)`. New gerunds, same glyph set, same two punctuation
# fragments in every sample; the finished line `✻ Sautéed for 1m 2s` still
# carries neither.
[[rule]]
name = "spinner"
state = "working"
all = ["… (", "s · "]

# claude is drawn and waiting for a human to type. This is the mode footer
# under the input box, and the glyph it opens with is what every mode and every
# width have in common — see the permission rule above for the measurement.
# Anchoring `idle` on the cycle hint instead made a manual-mode agent, and any
# agent on a pane under about 40 columns, match no rule at all.
#
# `? for shortcuts` is claude's pre-2.1 hint, kept as an alternative so amx is
# not blind against an older vendor.
#
# `quiescent` is the whole point of this entry, and names the trap it exists
# for: THIS FOOTER IS ON THE SCREEN WHILE CLAUDE WORKS, TOO. Not similarly —
# identically. With the control characters stripped, a capture taken mid-turn
# and one taken after the same turn's Stop hook differ only in the transcript
# above them. While a long answer streams the vendor drops its spinner line
# entirely (203 of 203 samples across one 207-second turn), so there is no
# positive mark to anchor on and nothing but TIME separates an idle screen from
# a pause between two chunks of output.
#
# So a quiescent rule may not end a turn that is on the record as running until
# the screen has held still across a run of consecutive looks. From a state
# with nothing outstanding — starting, or unknown — it decides at once, which
# is what gets a parked agent named inside ten seconds.
#
# Without that gate the rule calls a working agent idle, which is strictly
# worse than `unknown`: measured at two consecutive looks, it reported a live
# turn as finished 51 seconds before its Stop hook arrived. The longest
# mid-turn stillness measured at the floor's own rate is ten seconds, at the
# tail of a turn after the answer had finished streaming.
#
# The glyph itself was seen live against v2.1.237 on 2026-08-21 — the welcome
# box now reads `Claude Code v2.1.237` — in all four modes reachable by
# shift+tab (auto, manual, accept edits, plan) at 220, 46, 40 and 30 columns,
# unchanged from the table above. The stillness timings were not re-measured
# this round; nothing about a version bump changes how long a model takes to
# pause between tokens.
#
# Seen live again in auto mode against v2.1.240 on 2026-08-24 at 220 columns,
# where the footer's tail has changed on its own:
#
#   ⏵⏵ auto mode on (shift+tab to cycle) · ← 2 agents
#
# `← for agents` now counts them. This rule did not notice, because the tail is
# not what it reads — which is the anchor law paying for itself twice in three
# vendor bumps.
[[rule]]
name = "idle_prompt"
state = "idle"
quiescent = true
any = ["⏵⏵", "⏸", "shift+tab to cycle", "? for shortcuts"]
