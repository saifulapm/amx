# Screen rules for claude panes.
#
# When the hooks go quiet, a reader matches the bottom of the pane against
# these rules. They cover claude's four blocking prompts, the spinner row, the
# chrome under an idle prompt, and the notification sentences that stand in
# for a question. A screen no rule claims reads `unknown`.
#
# Rules are ordered and the first that holds decides, so specific screens come
# first. A rule holds when every string in `all` appears and, if `any` is
# given, at least one of those does too, within `within` rows of each other. A
# string in `not` anywhere in the visible rows vetoes the rule; a string in
# `not_below` under the match vetoes it too. Matching runs on the capture with
# control characters replaced and case folded, so a colour change inside a
# word cannot hide an anchor.
#
# Anchors:
# - Every string is measured off a live claude across its modes and widths.
#   Strings read from source are not measurements: `esc to interrupt` and
#   `? for shortcuts`, taken from source, never appeared on claude 2.1.226.
# - Wrapping splits phrases across rows, so anchor on a single word or on the
#   fragment a row opens with. `you trust` breaks at 61 to 67 columns;
#   `shift+tab to cycle` is gone below 46 columns and absent in manual mode.
# - src/vendor/claude.rs points at this file. Every string here is claude's.

# Notification messages that carry no question. A reader drops them and reads
# the screen instead. claude 2.1.240 fires a `permission_prompt` notification
# six seconds after any dialog opens, whose message is the dialog's title,
# `Claude needs your permission`. A tool permission box sends `Claude needs your
# permission to use <tool>` on the same timer, and either may land last, so
# these match as whole sentences, never as prefixes. The idle nudge is here
# because older claudes send it untyped.
placeholders = [
  "Claude needs your permission",
  "Claude is waiting for your input",
]

# The chrome claude draws around the composer. `src/furniture.rs` walks up from
# the bottom of a capture over it, so a card and `amx logs` show the agent's
# rows and not the vendor's.
#
# - `mode`: the footer's opening glyphs. Present in all six permission modes at
#   every width from 24 to 220; the words after them are gone by 30 columns.
# - `rule`: the composer box's border glyph.
# - `statusline`: how many statusline rows the walk steps over to reach the
#   box. A statusline command prints as many rows as it likes; claude 2.1.263
#   drew up to eight and no mode footer at all past that.
# - `bottom`: rows the bottom border can take. One at 22 columns and wider, two
#   below that, where the box wraps (claude 2.1.237, widths 20 to 100, heights 8
#   to 30).
# - `spinner`: the gerund's ending and ellipsis, the one fragment the spinner
#   row keeps at every width. claude spins `● Actioning…` alone before the first
#   token, so the fragments after it cannot be required.
# - `beneath`, `panel`: the agents panel claude 2.1.270 draws under the footer
#   (a blank row, `● main`, one `◯ ` row per agent). `panel` caps the rows,
#   blanks included, the walk steps over before it must meet the footer.
# - `hint`: the right-aligned effort row on the composer's top border,
#   `● high · /effort`. Optional, so the walk steps over it but never requires
#   it. Matched as a fragment because right alignment moves its start.
# - `tip`: the `⎿  Tip:` row claude 2.1.226 drew between the spinner and the
#   composer.
#
# `interrupted` is not part of the walk. It is the opening of the row claude
# leaves in the transcript when esc interrupts a turn, and the only sign of
# that: claude sends no hook for it. claude 2.1.278 truncates the row from the
# middle, so only its head survives every width:
#
#   100  ⎿  Interrupted · What should Claude do instead?
#    40  ⎿  Interrupte· What should Claude do
#    24  ⎿  Interrup· What
#
# The gap after `⎿` is a space and a U+00A0. The walk folds it before matching
# (`furniture::spaced`), so the anchor is written with two ordinary spaces. The
# row stays in the transcript, so it counts only as the last row the agent
# earned; see `Furniture::cut_by_hand`.
#
# `shells` is not part of the walk either. It matches the mode footer's tail
# while claude has a background shell running, the only sign that the count a
# Stop hook wrote (`State::background`) still holds; killing a shell from the
# pane sends nothing. claude 2.1.278, one `sleep` running, then killed:
#
#          running                               idle
#   100  ⏵⏵ bypass permissions on · 1 shell    ⏵⏵ bypass permissions on (shift+tab to cycle)
#    40  ⏵⏵ bypass permissions on · 1 shell    ⏵⏵ bypass permissions on (shift+tab
#    30  ⏵⏵ bypass permissions on ·            ⏵⏵ bypass permissions on
#    24  ⏵⏵ bypass      · 1                    ⏵⏵ bypass
#
# The tail replaces the cycle hint, and `shell` is cut below 40 columns, so the
# separator is named too. A tail about something else then reads as a shell
# running, which only holds the count. The reverse error would end a live turn.
# claude 2.1.278 ends every footer with `· ← for agents`, so `footer_hints`
# strips that tail before `shells` is matched. `← 5 agents` is left on and still
# reads as running.
[furniture]
mode = ["⏵⏵", "⏸"]
spinner = ["ing…"]
rule = "─"
statusline = 8
bottom = 2
beneath = ["● ", "◯ "]
panel = 8
hint = ["/effort"]
tip = ["⎿  Tip:"]
interrupted = ["⎿  Interrup"]
shells = ["shell", "·"]
footer_hints = ["· ← for agents"]

# The folder-trust gate, drawn before the prompt exists, so it comes first.
# Wording as of claude 2.1.259 (220, 54, 40, 30 and 24 columns):
#
#   Quick safety check: Is this a project you created or one you trust? (Like
#   your own code, …). If not, take a moment to review what's in this folder
#   first.
#   Security guide
#   ❯ No, exit
#     Yes, I trust this folder
#   Enter to confirm · Esc to cancel
#
# `trust` is a single word because 54 columns wraps `you` from `trust`. The word
# alone is common prose, so the confirm footer's opening must be in the same
# box. `within` is 19, the box's height at 24 columns.
#
# `asks = quick` takes the question from its first row. `trust` would find
# `Yes, I trust this folder`, an answer, since the choices carry no numbers to
# stop at since 2.1.259. `marks` reads the choices as the run under the cursor
# glyph, which amx numbers itself; where the vendor numbers its rows, those
# numbers are used instead (`Rule::question`). Unchanged at claude 2.1.276.
#
# `setup` marks a gate in front of the work, which `doctor` reports. It is the
# only screen here with the flag: claude's login prompt has no rule, for the
# reason `src/verbs/doctor.rs` gives.
[[rule]]
name = "folder_trust"
state = "waiting"
kind = "trust"
setup = true
all = ["trust"]
any = ["enter to confirm"]
within = 19
not_below = ["⏵⏵", "⏸", "shift+tab to cycle", "? for shortcuts"]
asks = { sentence = "quick" }
marks = "❯"

# The permission box, as claude 2.1.226 and 2.1.237 draw it for Bash, Write and
# Edit. Seen only in manual mode or under an `ask` rule; auto mode approves
# without asking.
#
#   ────────────────────────────────────────────
#    Bash command
#      rm -f b.txt
#    Permission rule Bash requires confirmation for this command.
#    Do you want to proceed?
#    ❯ 1. Yes
#      2. No
#    Esc to cancel · Tab to amend · ctrl+e to explain
#
# The wording after `do you want to` varies by tool, so the anchor stops there.
#
# Blocking prompts and `not_below`:
# - A bare `❯` is no evidence: it is the composer chevron, on every screen.
# - No anchor tells a prompt from a quotation of one, such as a pasted capture.
#   Layout does: claude draws no composer or mode footer under a blocking
#   prompt, and quoted text always sits in a turn with both below it. So the
#   mode footer below the match vetoes it.
# - The footer is named by its opening glyph, not the composer row, because `❯`
#   also opens every option and `send` can stage `❯ 1. …` in the composer.
#
# The footer in all six modes (24 to 220 columns, claude 2.1.226, unchanged at
# 2.1.237):
#
#   ⏵⏵ auto mode on (shift+tab to cycle) · ← for agents
#   ⏵⏵ accept edits on (shift+tab to cycle) · ← for agents
#   ⏸ plan mode on (shift+tab to cycle) · ← for agents
#   ⏸ manual mode on · ← for agents               ← no hint at any width
#   ⏵⏵ bypass permissions on (shift+tab to cycle) · ← for agents
#   ⏵⏵ don't ask on (shift+tab to cycle) · ← for agents
#
# The hint truncates from the right: intact at 46 columns, `(shift+tab to` at
# 40, gone by 30. The glyphs are on no blocking screen. The hint and the pre-2.1
# `? for shortcuts` stay as alternatives for older claudes.
#
# `not`: the question menu can ask `Do you want to …` and shares `❯ 1.` and
# `Esc to cancel`. `Enter to select` is on its footer and on no permission box.
# `asks`: the question is the anchor's row; the rows above it describe the
# request.
[[rule]]
name = "permission_prompt"
state = "waiting"
kind = "permission"
all = ["do you want to"]
any = ["❯ 1.", "esc to cancel"]
within = 16
not_below = ["⏵⏵", "⏸", "shift+tab to cycle", "? for shortcuts"]
not = ["enter to select"]
asks = { sentence = "do you want to" }

# The menu drawn by the AskUserQuestion tool. Measured on claude 2.1.229 in
# five modes at eight widths from 24 to 191 columns, and unchanged at 2.1.237
# and 2.1.240. `dontAsk` mode blocks the tool, leaving an idle screen.
#
#    ☐ Indentation
#   Should this project be indented with spaces or tabs?
#   ❯ 1. Spaces
#        Indent with spaces (most common default).
#     2. Tabs
#     3. Type something.
#   ──────────────────────────────────────────────────────
#     4. Chat about this
#   Enter to select · ↑/↓ to navigate · Esc to cancel
#
# `enter to select` opens the footer row, which wraps rather than truncates, so
# it survives every width. At 24 columns the footer reads `Enter to select ·
# ↑/↓ to` / `navigate · Esc to` / `cancel`, which is why `esc to cancel` is
# only an alternative.
#
# `❯ 1.` sits at the top of a box whose height the agent's descriptions set, so
# it can fall outside the floor (claude 2.1.259, 24 columns). `chat about this`
# is the vendor's last row before the footer on every shape of this tool, so it
# is always in range. `within` is 24 because no height bounds the box;
# `not_below` carries the weight.
#
# The tool's other shapes (checkboxes, question tabs, a preview with a note
# field, a free-text `Other` row) all keep a footer opening with `Enter to
# select`, so this rule claims them; docs/question-shapes.md has the captures.
# Reading their contents is `Rule::question`'s job:
# - a checkbox choice reads `❯ 1. [ ] Logging`, an answered tab adds ` ✔`;
# - the row under a checkbox list's `Other` reads `Submit` or `Next`;
# - a preview sits on the choice rows, drops `Other`, and unnumbers `Chat about
#   this`;
# - tab headers elide as the pane narrows, so tab names are only in the payload;
# - on a tall pane the vendor pads below the footer, which can push the
#   question out of the floor. The rule still holds; the question reads empty.
#
# A menu also fires `PermissionRequest` and a `permission_prompt` notification,
# so this rule outranks a record that says `permission`.
#
# Not claimed: the review tab that ends a multi-select or multi-question call.
# It draws `Review your answers`, `Ready to submit your answers?` and `❯ 1.
# Submit answers` with no footer, and reads `unknown`. `review your answers` is
# whole at 24, 54 and 220 columns and opens its row.
[[rule]]
name = "ask_menu"
state = "waiting"
kind = "question"
all = ["enter to select"]
any = ["chat about this", "❯ 1.", "esc to cancel"]
within = 24
not_below = ["⏵⏵", "⏸", "shift+tab to cycle", "? for shortcuts"]

# The plan approval box drawn by ExitPlanMode (claude 2.1.237 at 220, 54 and 24
# columns):
#
#   Claude has written up a plan and is ready to execute. Would you like to
#   proceed?
#
#   ❯ 1. Yes, and use auto mode
#     2. Yes, manually approve edits
#     3. Tell Claude what to change
#        shift+tab to approve with this feedback
#
#   ctrl+g to edit in Kak · ~/.claude/plans/write-a-one-paragraph-plan-snug-russell.md
#
# The sentence wraps after `to` at 54 columns and before `proceed?` at 24, so
# neither phrase can anchor. `ready` and `execute` stay on one row at every
# width measured. Like the other blocking prompts it has nothing below it.
[[rule]]
name = "plan_approval"
state = "waiting"
kind = "permission"
all = ["ready", "execute"]
any = ["❯ 1."]
within = 16
not_below = ["⏵⏵", "⏸", "shift+tab to cycle", "? for shortcuts"]

# A running turn. claude spins one row over the composer: a cycling glyph (`✻ ✽
# ✢ ✶ · *`), a gerund, `…`, then a parenthesised tail it drops from the right as
# the pane narrows (claude 2.1.259):
#
#   220  ● Finagling… (6s · thinking with xhigh effort)
#    40  ● Finagling… (4s · thinking)
#    30  ● Finagling… thinking
#    24  ● Finagling… (2s)
#
# The tail also changes at a fixed width as the gerund changes, so the anchor
# is the gerund's ending and the ellipsis. `…` alone is claude's elision mark
# and appears on idle panes (statusline, welcome box). The finished-turn row is
# past tense with no ellipsis (`✻ Brewed for 1m 22s`), which this must never
# match. A non-gerund spinner word would make this rule go quiet.
#
# `over_composer`: the fragment counts only on the row the furniture walk finds
# directly over the composer. Elsewhere it matches tool results
# (`⎿  Initializing…`) and truncated statuslines. A screen with no composer the
# walk can find (the /btw overlay, the transcript viewer, a pane too narrow for
# the footer) reads `unknown`. A false match also clears a pending question.
# Re-measure this rule first on a vendor bump.
[[rule]]
name = "spinner"
state = "working"
all = ["ing…"]
over_composer = true

# Subagents still running after Stop. claude 2.1.270 fires Stop when the answer
# ends and shows this line over the composer while the subagents finish
# (100, 54, 40, 30 and 24 columns):
#
#   ✻ Waiting for 1 background agent to finish
#                                                            ● high · /effort
#   ────────────────────────────────────────────────────────────────────────
#   ❯
#   ────────────────────────────────────────────────────────────────────────
#     Opus 5 (1M context) (1M context) │ ◈ 2% │ measure-270 │ ◖ high
#     ⏵⏵ auto mode on (shift+tab to cycle) · ← 2 agents
#
#     ● main
#     ◯ general-purpose  Preparing to run `sleep 45`        48s · ↓ 10.2k tokens
#
# `✻` ties the words to the vendor's row; `waiting for` alone is common prose.
# The line wraps after `to`, `background` or `1` depending on width, putting
# `background` at most one row down, so `within` is 3. No `not_below`: the
# composer and footer are always under it. This is a reading only; it never
# overwrites what the hooks recorded.
[[rule]]
name = "background_agents"
state = "working"
all = ["✻ waiting for"]
any = ["background"]
within = 3

# At the prompt, waiting for input: the mode footer's glyph, present in every
# mode and width (see `permission_prompt`). The cycle hint alone missed manual
# mode and panes under about 40 columns. `? for shortcuts` covers pre-2.1
# claude. The tail after the mode changes between versions (`← 2 agents` in
# 2.1.240) and is not read.
#
# `quiescent`: the footer is also on screen while claude works, and a streaming
# answer drops the spinner row (203 of 203 samples over one 207-second turn),
# so only time separates idle from a pause in output. A quiescent rule cannot
# end a turn the record shows running until the screen holds still over
# several looks; from `starting` or `unknown` it decides at once. Two looks
# once ended a live turn 51 seconds early. The longest mid-turn stillness
# measured is ten seconds.
#
# `not` covers screens drawn over the prompt without a mode row (claude 2.1.270,
# 24 to 100 columns):
# - the ctrl+o transcript viewer, whose footer ends in `? for shortcuts`. It
#   truncates from the middle, so only its opening `showing detaile` survives
#   every width.
# - the /btw overlay's answered footer, `↑/↓ to scroll · c to copy · …`. While
#   it is still answering its `Answering…` is not over a composer, so it reads
#   `unknown`.
[[rule]]
name = "idle_prompt"
state = "idle"
quiescent = true
any = ["⏵⏵", "⏸", "shift+tab to cycle", "? for shortcuts"]
not = ["showing detaile", "↑/↓ to scroll"]
