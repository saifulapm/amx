# amx configuration, with every default written out.
#
# Copy this file to ~/.config/amx/config.toml and change what you want. Every
# value below is the default, so a copy you never edit behaves like no file at
# all. amx warns about a key it does not know and ignores it. A file that does
# not parse is ignored with a warning, and amx runs on the defaults.
#
# A project can keep the same file at <repo>/.amx/config.toml. Its keys are laid
# over yours one at a time, so a one-line project file changes one key. amx
# reads a project file only after you run `amx allow` in that project, and any
# edit to the file needs a new `amx allow`. A project file cannot set
# `permission`, `trust` or `subagents_may_escalate`.

# The command a new agent runs: claude, pi, codex, opencode or your own. amx
# tells the vendor from the program name, so
# `claude --dangerously-skip-permissions` is still claude and gets its dials.
agent = "claude"

# How many live agents one project may have before `amx new` refuses. Each
# project counts its own agents.
max_agents = 5

# How many live agents all projects on this machine may have together. No limit
# when left out.
# max_total = 10

# How many live children one agent may have at once. 0 means no limit.
# Children do not count toward max_agents or max_total.
max_children = 8

# How deep a chain of subagents may go: 2 allows a child and a grandchild, 1
# only a child, 0 no children at all. Only `amx sub` records a parent, so only
# `amx sub` is limited.
subagent_depth = 2

# Whether `amx sub` accepts `--permission`. A child inherits its parent's model
# and effort; a permission mode of its own is refused while this is false.
subagents_may_escalate = false

# Give each agent its own git worktree, so two agents never edit one checkout.
# `amx new --no-worktree` skips it for one spawn.
worktrees = true

# Where notices go when an agent finishes or stops on a question: "desktop"
# (the desktop's notifier), "terminal" (a notification escape written to every
# terminal attached to your tmux servers), "both" or "off". true and false
# still work and mean "desktop" and "off".
notifications = "desktop"

# Answer the vendor's folder-trust screen for worktrees amx creates. For claude
# this writes an entry to claude's own trust store, which outlives the agent.
# For pi it passes --approve and writes nothing. codex and opencode are not
# affected. Off by default because the trust store is the vendor's file.
trust = false

# The dials a new agent starts with. Leave a key out to pass no flag and let
# the vendor decide. A value the configured agent does not accept is warned
# about and dropped.
#
#   claude:   model is any id or alias (fable, opus, sonnet, haiku); permission
#             is acceptEdits, auto, bypassPermissions, manual, dontAsk or plan;
#             effort is low, medium, high, xhigh or max.
#   pi:       model is any provider/id pattern; effort is off, minimal, low,
#             medium, high, xhigh or max; no permission dial.
#   codex:    model is any id; permission is the sandbox: read-only,
#             workspace-write or danger-full-access; effort is low, medium,
#             high, xhigh or max.
#   opencode: model is provider/model; permission is auto; no effort dial.
# model = "opus"
# permission = "plan"
# effort = "high"

# A command that writes the one-line summary shown on an agent's row. It runs
# in the agent's directory with the answer on stdin and $AMX_ID set, and its
# first line of output is used. While a turn is running it is also asked every
# three minutes, from the conversation so far. Only the view runs it. Left out,
# nothing runs.
# summary_command = "claude -p 'Sum this up in eight words. Answer with the words alone.'"

# The view's colours: a theme amx ships (auto, default, light, terminal), the
# name of a file in ~/.config/amx/themes, or a path to one. The file is re-read
# when it changes, so a running view picks up the new theme.
#
# `auto` asks the terminal whether its background is light or dark and uses
# `light` or `default` to match.
theme = "auto"

# Seconds an idle agent nobody is watching keeps its pane. An idle vendor still
# holds a few hundred megabytes, so after this long amx closes the pane and
# keeps the record; enter, attach or resume starts the agent again where it
# left off. Attached and pinned agents are never parked. 0 turns this off.
park_after = 3600

# What a new worktree gets before its agent starts, so the first turn goes on
# the task and not on setup. Paths are relative to the repository root, with no
# globs. A path that does not exist is warned about and skipped.
#
#   copy:  files copied from the repository root, for the few git does not
#          track (such as .env).
#   link:  directories symlinked to the repository's own, so agents share one
#          install.
#   setup: commands run in the worktree with sh -c, in order, with AMX_ID,
#          AMX_WORKTREE, AMX_REPO and AMX_AGENT_DIR set. If one fails, the
#          spawn is refused and the worktree removed.
# copy = [".env"]
# link = ["node_modules"]
# setup = ["pnpm install"]

# The ref new worktrees are created from: any branch, tag or commit. Left out,
# it is HEAD in the directory where you ran `amx new`.
# base = "main"

# A pager for `amx diff`: it gets the unified diff on stdin and runs in the
# agent's worktree. Left out, amx prints git's own diff. Piped output and
# `--stat` always use git's diff.
# diff = "delta --paging=always"

# Commands run when an agent reaches a state: waiting on a question, idle at its
# prompt, done, failed, or stopped by you. Each runs with sh -c in the agent's
# worktree (or its directory when it has none), in the background, with the
# event as one JSON line on stdin. The environment has AMX_ID, AMX_STATE,
# AMX_DIR, AMX_AGENT_DIR, AMX_NESTED, AMX_WORKTREE when there is a worktree,
# and, for all but on_stopped, AMX_WATCHED (1 when someone is attached to the
# pane, else 0). Output is discarded; redirect it yourself to keep it.
# on_waiting = "curl -sX POST https://hooks.example.com/amx -d @-"
# on_idle = "echo $AMX_ID idle >> ~/amx.log"
# on_done = "notify-send 'amx' \"$AMX_ID $AMX_STATE\""
# on_failed = "gh issue comment 41 -b \"$AMX_ID failed\""
# on_stopped = "echo $AMX_ID stopped >> ~/amx.log"

# Your own keys in the view, each bound to a shell command. Write ctrl+ and
# alt+ in either order, then one character or f1 to f12; a capital letter
# means shift. The command runs with sh -c in the selected agent's worktree (or
# its directory), on the view's terminal, with AMX_ID, AMX_DIR, AMX_AGENT_DIR,
# AMX_NESTED and AMX_WORKTREE set. The view waits for it and shows only errors.
# The keys screen lists these under `yours`.
#
# A key amx already uses is refused when the view opens. A project file adds
# its entries to yours one key at a time.

[keys]
# "alt+g" = "lazygit"
# "alt+t" = "cargo test 2>&1 | less"

# One table per harness amx supports, named after its command. A table for any
# other name is warned about and ignored.
#
#   models: the models that select this harness. `amx new --model X` starts
#           the harness whose list holds X. Left out, the harness's own list
#           is used.
#   args:   arguments added to every agent of this harness. A dial amx would
#           set gives way to a flag written here.
#   env:    a sub-table of environment variables for every agent of this
#           harness, laid over your environment. Values are literal, except a
#           leading ~. amx's own AMX_ID, AMX_BIN, AMX_DIR and AMX_AGENT_DIR
#           always win.
#
# A project's env cannot set PATH, HOME, SHELL, CLAUDE_CONFIG_DIR, CODEX_HOME,
# OPENCODE_CONFIG_DIR, OPENCODE_CONFIG, OPENCODE_CONFIG_CONTENT, or anything
# starting with LD_, DYLD_ or AMX_.

