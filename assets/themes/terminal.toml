# The palette that follows the terminal's own colour scheme.
#
# Colour names only, so the view changes with the terminal's scheme, light or
# dark, without being told.

# Something is waiting on a person.
waiting = "yellow"
# It finished as intended.
done = "green"
# It was attempted and failed.
failed = "red"
# It was ended by hand.
stopped = "gray"
# The permission the next agent will start with, shown under the line that
# starts it.
accent = "cyan"
# Background of the cursor's row: the scheme's dark grey.
cursor = "darkgray"
