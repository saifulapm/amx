# The palette for a terminal with a light background.
#
# The same six roles as `default`, with colours that stay readable on white.
# The five states are GitHub's light palette. Every value is a hex colour
# rather than a name, since a name takes whatever the terminal's scheme gives
# it; use `terminal` to follow the scheme.
#
# A value is a terminal colour name ("cyan"), a 256-colour index ("134") or a
# hex colour ("#4eba65"). To make your own theme, copy this file to
# ~/.config/amx/themes/<name>.toml and set `theme = "<name>"` in config.toml.

# Something is waiting on a person. A darker amber, since the default's is
# unreadable on white.
waiting = "#9a6700"
# It finished as intended.
done = "#1a7f37"
# It was attempted and failed.
failed = "#cf222e"
# It was ended by hand.
stopped = "#6e7781"
# The permission the next agent will start with, shown under the line that
# starts it.
accent = "#0550ae"
# Background of the cursor's row: a shade darker than the page, light enough
# that the row's text stays readable.
cursor = "#d8dee4"
