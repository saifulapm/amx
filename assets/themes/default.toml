# The default palette, for a dark terminal.
#
# Five colours are claude's own, taken from the 2.1.237 binary, so the view
# matches the claude panes beside it. `accent` is the terminal's cyan.
#
# Colour marks only outcomes and things waiting on a person; everything else is
# said with words, weight and the terminal's dim.
#
# A value is a terminal colour name ("cyan"), a 256-colour index ("134") or a
# hex colour ("#4eba65"). To make your own theme, copy this file to
# ~/.config/amx/themes/<name>.toml and set `theme = "<name>"` in config.toml.

# Something is waiting on a person.
waiting = "#ffc107"
# It finished as intended.
done = "#4eba65"
# It was attempted and failed.
failed = "#ff6b80"
# It was ended by hand.
stopped = "#999999"
# The permission the next agent will start with, shown under the line that
# starts it. The terminal's cyan, since claude's own colour for its permission
# row has not been measured.
accent = "cyan"
# Background of the cursor's row, so the row keeps its own foreground colours.
cursor = "#373737"
