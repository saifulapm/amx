# The conf amx's own tmux server is born with.
#
# A server born without `-f` reads the person's `~/.tmux.conf`, which is theirs
# and is not written with agent panes in mind. This file has to ride every call
# that could create the server, because whichever one arrives first is the one
# that starts it.

# Captures are amx's evidence, and a screenful is not always enough of it.
set -g history-limit 50000

# Escape is a key an agent is sent, not the start of a sequence to wait on.
set -g escape-time 10

set -g default-terminal "tmux-256color"
set -g mouse on

# Panes are addressed by id and named by their agent; the numbers underneath
# are noise on a wall.
set -g base-index 1
set -g pane-base-index 1
